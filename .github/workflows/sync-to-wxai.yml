name: Sync Notebook to watsonx.ai

on:
  push:
    branches:
      - main
    paths:
      - 'notebooks/**.ipynb'   # only triggers when notebooks are modified
  workflow_dispatch:           # adds a "Run workflow" button for manual runs

jobs:
  deploy-to-watsonx:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ibm-watsonx-ai SDK
        run: pip install --quiet ibm-watsonx-ai

      - name: Run Deploy Script
        env:
          IBM_CLOUD_API_KEY: ${{ secrets.IBM_CLOUD_API_KEY }}
          WATSONX_PROJECT_ID: ${{ secrets.WX_PROJECT_ID }}
        run: python scripts/deploy_notebook.py
