name: Sync notebook to watsonx.ai

on:
  push:
    branches:
      - main
    paths:
      - "wxai_git_poc.ipynb"

jobs:
  sync:
    name: Push notebook asset to wx.ai project
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: pip install ibm-watson-machine-learning --quiet

      - name: Sync notebook to wx.ai project
        env:
          IBM_CLOUD_API_KEY: ${{ secrets.IBM_CLOUD_API_KEY }}
          WX_PROJECT_ID: ${{ secrets.WX_PROJECT_ID }}
          WX_URL: ${{ secrets.WX_URL }}
        run: python3 .github/scripts/wxai_sync.py wxai_git_poc.ipynb
